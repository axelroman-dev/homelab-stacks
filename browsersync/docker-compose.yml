services:
  db:
    image: postgres:16-alpine
    container_name: browsersync-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=browsersync
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=browsersync
    volumes:
      - ./data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U browsersync -d browsersync"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: axelromandev/browsersync-server:1.1.0
    container_name: browsersync
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://browsersync:${POSTGRES_PASSWORD}@db:5432/browsersync
      - JWT_SECRET=${JWT_SECRET}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - TRUST_PROXY_HOPS=1
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
