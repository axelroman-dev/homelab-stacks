services:
  firefly:
    image: fireflyiii/core:latest # podés fijar una versión con fireflyiii/core:version-x.x.x
    container_name: firefly
    restart: unless-stopped
    depends_on:
      - firefly_db
    environment:
      - APP_URL=${APP_URL}
      - TRUSTED_PROXIES=**
      - DB_CONNECTION=mysql
      - DB_HOST=firefly_db
      - DB_PORT=3306
      - DB_DATABASE=firefly
      - DB_USERNAME=firefly
      - DB_PASSWORD=${FIREFLY_DB_PASSWORD}
      - APP_KEY=${FIREFLY_APP_KEY}
      - TZ=America/Mexico_City
    volumes:
      - ./data/upload:/var/www/html/storage/upload
    networks:
      - default
      - proxy

  firefly_db:
    image: mariadb:lts
    container_name: firefly_db
    restart: unless-stopped
    environment:
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=firefly
      - MYSQL_USER=firefly
      - MYSQL_PASSWORD=${FIREFLY_DB_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql

networks:
  proxy:
    external: true
