  services:
    app:
      image: axelromandev/finanzas-personales:0.2.0
      container_name: finanzas-app
      restart: unless-stopped
      env_file:
        - .env
      environment:
        DATABASE_URL: postgresql://finanzas:${DB_PASSWORD:?DB_PASSWORD requerido en .env}@db:5432/finanzas?schema=public
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET requerido en .env}
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        NEXT_TELEMETRY_DISABLED: "1"
        NODE_ENV: production
      depends_on:
        db:
          condition: service_healthy
      networks:
        - finanzas-net
        - proxy
      healthcheck:
        test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 60s

    db:
      image: postgres:16-alpine
      container_name: finanzas-db
      restart: unless-stopped
      environment:
        POSTGRES_USER: finanzas
        POSTGRES_PASSWORD: ${DB_PASSWORD:-finanzas}
        POSTGRES_DB: finanzas
      volumes:
        - ./data:/var/lib/postgresql/data
      networks:
        - finanzas-net
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
        interval: 5s
        timeout: 5s
        retries: 5

  networks:
    finanzas-net:
      driver: bridge
    proxy:
      external: true
